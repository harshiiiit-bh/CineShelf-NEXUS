<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          function SafeWebSocket(url, protocols) {
            var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
            if (protoStr.indexOf('vite-hmr') !== -1 || protoStr.indexOf('vite-ping') !== -1) {
              var virtualSocket = new EventTarget();
              virtualSocket.readyState = 1;
              virtualSocket.CONNECTING = 0;
              virtualSocket.OPEN = 1;
              virtualSocket.CLOSING = 2;
              virtualSocket.CLOSED = 3;
              virtualSocket.url = String(url || '');
              virtualSocket.protocol = protoStr;
              virtualSocket.send = function () {};
              virtualSocket.close = function () {
                virtualSocket.readyState = 3;
              };
              setTimeout(function () {
                virtualSocket.dispatchEvent(new Event('open'));
              }, 0);
              return virtualSocket;
            }
            return protocols !== undefined
              ? new NativeWebSocket(url, protocols)
              : new NativeWebSocket(url);
          }
          SafeWebSocket.prototype = NativeWebSocket.prototype;
          SafeWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          SafeWebSocket.OPEN = NativeWebSocket.OPEN;
          SafeWebSocket.CLOSING = NativeWebSocket.CLOSING;
          SafeWebSocket.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket = SafeWebSocket;
        }
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var msg = reason && (reason.message || String(reason));
          if (typeof msg === 'string' && msg.indexOf('WebSocket closed without opened') !== -1) {
            event.preventDefault();
          }
        });
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineShelf NEXUS</title>
    <meta name="description" content="A secure, intelligent personal entertainment management platform combining viewing diaries, series tracking, franchise timelines, streaming availability, and explainable recommendations." />
    <meta property="og:title" content="CineShelf NEXUS" />
    <meta property="og:description" content="A secure, intelligent personal entertainment management platform combining viewing diaries, series tracking, franchise timelines, streaming availability, and explainable recommendations." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#070B14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CineShelf" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#070B14] dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root">
      <div id="cineshelf-boot-diagnostic" role="status" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#070B14;color:#e2e8f0;font-family:system-ui,sans-serif;text-align:center">
        <div style="max-width:560px">
          <div style="font-size:12px;letter-spacing:.18em;color:#60a5fa;font-weight:700">CINESHELF NEXUS</div>
          <h1 id="cineshelf-boot-title" style="font-size:22px;margin:14px 0 8px">Starting application…</h1>
          <p id="cineshelf-boot-detail" style="font-size:13px;line-height:1.6;color:#94a3b8">Loading the production app. This screen should disappear when CineShelf is ready.</p>
        </div>
      </div>
    </div>
    <script>
      (function () {
        function showBootError(title, detail) {
          var panel = document.getElementById('cineshelf-boot-diagnostic');
          if (!panel) {
            var root = document.getElementById('root');
            if (!root) return;
            panel = document.createElement('div');
            panel.id = 'cineshelf-boot-diagnostic';
            panel.setAttribute('role', 'alert');
            panel.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;background:#070B14;color:#e2e8f0;font-family:system-ui,sans-serif;text-align:center';
            panel.innerHTML = '<div style="max-width:560px"><div style="font-size:12px;letter-spacing:.18em;color:#60a5fa;font-weight:700">CINESHELF NEXUS</div><h1 id="cineshelf-boot-title" style="font-size:22px;margin:14px 0 8px"></h1><p id="cineshelf-boot-detail" style="font-size:13px;line-height:1.6;color:#94a3b8;overflow-wrap:anywhere"></p><button onclick="location.reload()" style="margin-top:18px;padding:10px 16px;border-radius:8px;background:#2563eb;color:white;border:0">Reload</button></div>';
            root.appendChild(panel);
          }
          var titleNode = document.getElementById('cineshelf-boot-title');
          var detailNode = document.getElementById('cineshelf-boot-detail');
          if (titleNode) titleNode.textContent = title;
          if (detailNode) detailNode.textContent = detail || 'No additional error details were provided.';
          panel.style.display = 'flex';
        }
        // Only treat real JavaScript exceptions as startup failures.
        // Image/font/favicon load errors are expected to be handled by their own fallbacks
        // and must never replace the whole app with a giant encoded asset URL.
        window.addEventListener('error', function (event) {
          if (!(event instanceof ErrorEvent) || !event.message) return;
          var root = document.getElementById('root');
          if (root && root.dataset.appMounted === 'true') {
            console.error('CineShelf runtime error:', event.message, event.filename, event.lineno);
            return;
          }
          var location = event.filename ? ' (' + event.filename + ':' + event.lineno + ':' + event.colno + ')' : '';
          showBootError('CineShelf startup error', event.message + location);
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var root = document.getElementById('root');
          if (root && root.dataset.appMounted === 'true') {
            console.error('CineShelf unhandled promise rejection:', event.reason);
            return;
          }
          var reason = event && event.reason;
          showBootError('CineShelf startup error', reason && (reason.stack || reason.message) || String(reason || 'Unhandled promise rejection'));
        });
        window.addEventListener('cineshelf:boot-error', function (event) {
          showBootError('CineShelf could not render', event.detail || 'React reported a render error.');
        });
        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.dataset.appMounted !== 'true') {
            showBootError('Application did not start', 'The production JavaScript bundle did not complete the React startup sequence. Check the browser Console and Network tabs for the first failed asset or exception.');
          }
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
